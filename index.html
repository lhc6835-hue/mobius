<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>MÖBIUS — Drive the Folding City</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--mag:#ff4fd8;--amb:#ffb040;--cy:#7fdcff;--ink:#0a0610;--fd:'Unbounded','Arial Black',sans-serif;--fh:'Rajdhani','Arial Narrow',sans-serif;--fk:'Noto Sans KR',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:var(--fk);user-select:none}
canvas#gl{position:fixed;inset:0;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* ---------- boot ---------- */
#boot{position:fixed;inset:0;background:#05020a;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .8s,transform .8s}
#boot.done{opacity:0;transform:scale(1.08);pointer-events:none}
#boot .bl{font:900 44px var(--fd);letter-spacing:.32em;background:linear-gradient(90deg,#fff,#c9b6ff,#fff);-webkit-background-clip:text;color:transparent;animation:bootp 1.6s infinite}
#boot .bbar{width:280px;height:2px;background:#ffffff18;overflow:hidden}#boot .bbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mag),var(--amb));transition:width .3s}
#boot .bmsg{font:600 14px var(--fh);letter-spacing:.2em;color:#b9a9cc}
@keyframes bootp{50%{opacity:.55;letter-spacing:.36em}}
/* ---------- generic screens ---------- */
#ui{position:fixed;inset:0;z-index:10;pointer-events:none}
#ui.scr>*{pointer-events:auto}
#ui.scr{animation:scrIn .55s cubic-bezier(.2,.9,.2,1)}
@keyframes scrIn{from{opacity:0;transform:perspective(900px) rotateX(12deg) translateY(30px)}to{opacity:1;transform:none}}
body.fold-out #ui{transition:transform .38s cubic-bezier(.7,0,.9,.3),opacity .38s;transform:perspective(900px) rotateX(-70deg) scale(.9);transform-origin:50% 0;opacity:0}
body.fold-out #hud{opacity:0;transition:opacity .3s}
.primary,.menu button,.back,.g-act button,.set button{position:relative}
/* ---------- logo ---------- */
.logo{position:absolute;left:6vw;top:11vh;pointer-events:none!important}
.logo-main{display:flex;font:900 clamp(64px,10.5vw,170px)/0.9 var(--fd);letter-spacing:-.02em;position:relative}
.logo-main span{display:inline-block;background:linear-gradient(180deg,#fff 0%,#f3eaff 45%,#9d86c9 52%,#fff 60%,#d6c9ef 100%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 22px #ff4fd855);animation:lt 6s infinite;animation-delay:calc(var(--i,0)*.12s)}
.logo-main span:nth-child(2){--i:1}.logo-main span:nth-child(3){--i:2}.logo-main span:nth-child(4){--i:3}.logo-main span:nth-child(5){--i:4}.logo-main span:nth-child(6){--i:5}
@keyframes lt{0%,86%,100%{transform:none}88%{transform:translateY(-6px) skewX(-8deg)}90%{transform:translateY(3px) skewX(5deg) scaleY(.96)}92%{transform:none}}
.logo-main .o{position:relative}
.logo-main .dot{position:absolute;top:-.18em;width:.13em;height:.13em;background:linear-gradient(135deg,var(--amb),var(--mag));transform:rotate(45deg);box-shadow:0 0 18px var(--mag);animation:dotf 3.2s ease-in-out infinite}
.logo-main .d1{left:.17em}.logo-main .d2{right:.17em;animation-delay:-1.6s}
@keyframes dotf{50%{transform:rotate(225deg) translateY(-.08em)}}
.logo-main::before,.logo-main::after{content:attr(data-t);position:absolute;inset:0;font:inherit;letter-spacing:inherit;color:transparent;-webkit-text-stroke:1px #ff4fd8aa;pointer-events:none}
.logo-main::before{clip-path:inset(0 0 62% 0);animation:sl1 4.5s infinite steps(1)}
.logo-main::after{-webkit-text-stroke:1px #7fdcffaa;clip-path:inset(55% 0 0 0);animation:sl2 5.2s infinite steps(1)}
@keyframes sl1{0%,100%{transform:translateX(0)}20%{transform:translateX(9px)}22%{transform:translateX(-4px)}60%{transform:translateX(3px)}}
@keyframes sl2{0%,100%{transform:translateX(0)}35%{transform:translateX(-12px)}37%{transform:translateX(6px)}75%{transform:translateX(-2px)}}
.logo-mirror{font:900 clamp(64px,10.5vw,170px)/0.9 var(--fd);letter-spacing:-.02em;transform:scaleY(-1) skewX(-14deg);transform-origin:0 0;margin-top:.02em;background:linear-gradient(0deg,#ffffff40,transparent 55%);-webkit-background-clip:text;color:transparent;filter:blur(.5px);opacity:.7;animation:mir 7s ease-in-out infinite;height:.55em;overflow:hidden}
@keyframes mir{50%{transform:scaleY(-1) skewX(10deg)}}
.logo-sub{font:600 clamp(11px,1.05vw,17px) var(--fd);letter-spacing:.55em;color:#e8dcff;margin-top:-1.6em;padding-left:.4em;text-shadow:0 0 12px #ff4fd8}
.tag{position:absolute;left:6.3vw;top:calc(11vh + clamp(64px,10.5vw,170px)*1.62);font:500 13px var(--fk);letter-spacing:.18em;color:#cdbde6aa;pointer-events:none!important}

.car-tag{position:absolute;right:4vw;bottom:7vh;text-align:right;pointer-events:none!important}.car-tag small{display:block;font-size:13px;color:#ffffff88;letter-spacing:.2em}.car-tag b{font:900 34px var(--fd);letter-spacing:.04em}

.g-t{font:900 42px var(--fd);letter-spacing:.04em;background:linear-gradient(90deg,#fff,#d9c2ff);-webkit-background-clip:text;color:transparent}.g-s{font:700 24px var(--fh);color:var(--cy);letter-spacing:.1em}

.g-item:hover{background:#ffffff14}.g-item.sel{background:linear-gradient(90deg,#ff4fd844,transparent);border-left-color:var(--mag)}.g-item.own small{color:var(--cy)}.g-item.cur b::after{content:' ●';color:var(--amb);font-size:10px}

.g-name{font:900 34px var(--fd)}.g-tag{color:var(--amb);font-size:13px;margin:4px 0 12px;letter-spacing:.05em}.g-desc{font-size:14px;line-height:1.7;color:#ddd3ea;margin-bottom:16px}

.paints{display:flex;gap:7px;margin:18px 0 6px;flex-wrap:wrap}.pt{width:26px;height:26px;border-radius:50%;border:2px solid #ffffff30;transition:.15s}.pt:hover{transform:scale(1.15)}.pt.sel{border-color:#fff;box-shadow:0 0 0 3px var(--mag)}

.br-h{padding:12px 16px;border-bottom:1px solid #ffffff12}.br-h b{font:800 16px var(--fd);color:var(--bc);letter-spacing:.1em}.br-h small{margin-left:8px;color:#ffffff77;font-size:12px}
.br-g{position:absolute;left:0;right:0;top:48px;bottom:0}.br-g svg{position:absolute;inset:0;width:100%;height:100%}.br-g line{stroke:#ffffff22;stroke-width:2;stroke-dasharray:4 4}.br-g line.on{stroke:var(--bc);stroke-dasharray:none;opacity:.6}

.node b{font:700 11px var(--fh);letter-spacing:.08em;text-align:center;line-height:1.1}.node i{display:flex;gap:3px}.node em{width:9px;height:4px;background:#ffffff22}.node em.f{background:var(--bc);box-shadow:0 0 6px var(--bc)}
.node:hover{border-color:var(--bc);transform:translate(-50%,-50%) scale(1.08);z-index:2}.node.lock{opacity:.35}.node.has{border-color:var(--bc);background:linear-gradient(160deg,#2a1438,#140b1e)}.node.max{background:linear-gradient(160deg,var(--bc),#40204a);color:#120818}.node.max em.f{background:#120818;box-shadow:none}
.node.cap{width:120px;height:80px}.node.cap b{font-size:13px}.node.pulse{animation:np .6s}@keyframes np{40%{transform:translate(-50%,-50%) scale(1.3);filter:brightness(2)}}
.t-info{position:absolute;right:4vw;top:16vh;width:320px;padding:22px;background:linear-gradient(160deg,#120a1ccc,#07040bcc);border:1px solid #ffffff14}
.ti-n{font:900 22px var(--fd)}.ti-n small{font:500 13px var(--fk);color:#ffffff88;margin-left:6px}.ti-d{margin:12px 0;font-size:14px;line-height:1.7;color:#ddd3ea}.ti-l{font:700 14px var(--fh);letter-spacing:.2em;color:var(--amb)}.ti-r{font-size:12px;color:#ff8aa8;margin-top:6px}.ti-max{font:900 20px var(--fd);color:var(--amb);margin-top:14px}
.t-info button{margin-top:16px;min-width:100%;display:flex;gap:12px;align-items:baseline;padding:11px 18px;background:linear-gradient(90deg,#ff4fd8,#ff8a3d);color:#14051a;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}.t-info button span{font:800 17px var(--fd)}.t-info button small{font-size:12px}
.logs{position:absolute;left:4vw;top:17vh;width:300px;display:flex;flex-direction:column;gap:4px;max-height:66vh;overflow:auto}
.log{text-align:left;padding:9px 14px;background:#ffffff08;border-left:2px solid transparent}.log small{display:block;font:700 11px var(--fh);letter-spacing:.3em;color:var(--mag)}.log b{font-weight:500;font-size:14px}.log:hover,.log.sel{background:#ff4fd822;border-left-color:var(--mag)}.log.lock{opacity:.35}
.log-body{position:absolute;left:calc(4vw + 330px);right:4vw;top:17vh;padding:30px 36px;min-height:300px;background:linear-gradient(160deg,#120a1ccc,#07040bcc);border:1px solid #ffffff14;font-size:17px;line-height:2;color:#e9e0f5}
.log-body h3{font:700 15px var(--fh);letter-spacing:.3em;color:var(--amb);margin-bottom:16px}.log-body p{opacity:0;animation:typ .6s forwards}.log-body .dim{opacity:.5;animation:none}
@keyframes typ{from{opacity:0;transform:translateX(-10px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.stats-box{position:absolute;left:calc(4vw + 330px);right:4vw;bottom:12vh;display:flex;gap:30px;font-size:13px;color:#ffffff88}.stats-box b{display:block;font:700 22px var(--fh);color:#fff}
.set{position:absolute;left:4vw;top:18vh;display:flex;flex-direction:column;gap:22px;width:420px}.set label{display:flex;justify-content:space-between;align-items:center;font-size:15px}.set select,.set input{width:200px;background:#1a1024;color:#fff;border:1px solid #ffffff30;padding:6px}

.credits{font:500 11px/1.5 var(--fk);opacity:.55;margin-top:14px;max-width:560px;white-space:normal;text-align:left}
.p-t{position:absolute;left:6vw;top:30vh;font:900 80px var(--fd);letter-spacing:.05em}
#ui.pause,#ui.results{background:radial-gradient(ellipse at center,#0a0510aa,#000000dd)}
/* ---------- results ---------- */
.r-head{position:absolute;left:0;right:0;top:5vh;text-align:center}.r-t{font:900 clamp(40px,6vw,86px) var(--fd);letter-spacing:.03em;background:linear-gradient(180deg,#fff,#ff8ad8);-webkit-background-clip:text;color:transparent;animation:rt 1s cubic-bezier(.2,1.6,.4,1)}@keyframes rt{from{transform:scale(1.6);filter:blur(10px);opacity:0}}

.h-tl{position:absolute;left:3vw;top:3.5vh}.h-label{font:700 12px var(--fh);letter-spacing:.45em;color:#ffffff88}.h-score{font:800 40px var(--fd);letter-spacing:.02em;text-shadow:0 0 20px #ff4fd855}

.bank{position:absolute;left:0;top:100%;font:800 26px var(--fd);color:var(--amb);animation:bk 1.2s forwards}@keyframes bk{from{transform:translateY(0)}to{transform:translateY(-60px);opacity:0}}

.h-drift{position:absolute;right:0;top:-34px;display:flex;gap:4px;opacity:0;transition:.15s}.h-drift.on{opacity:1}.h-drift i{width:34px;height:6px;background:#ffffff22;transform:skewX(-25deg)}
.h-drift.l1 i:nth-child(1){background:#59c8ff;box-shadow:0 0 10px #59c8ff}.h-drift.l2 i:nth-child(-n+2){background:#ffa040;box-shadow:0 0 10px #ffa040}.h-drift.l3 i{background:#c86bff;box-shadow:0 0 12px #c86bff}.h-drift.flash{animation:bump .25s}

// ================= PROCEDURAL TEXTURES =================
function periodicNoise(size, period, seed) {
  // returns function(x,y) in [0,1] periodic over size pixels
  const R = mulberry(seed); const g = new Float32Array(period * period); for (let i = 0; i < g.length; i++) g[i] = R();
  const cell = size / period;
  return (x, y) => {
    const fx = x / cell, fy = y / cell; const xi = Math.floor(fx), yi = Math.floor(fy);
    const xf = fx - xi, yf = fy - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const x0 = ((xi % period) + period) % period, y0 = ((yi % period) + period) % period, x1 = (x0 + 1) % period, y1 = (y0 + 1) % period;
    return lerp(lerp(g[y0 * period + x0], g[y0 * period + x1], u), lerp(g[y1 * period + x0], g[y1 * period + x1], u), v);
  };
}

  const p1 = [periodicNoise(S, 5, 21), periodicNoise(S, 10, 22), periodicNoise(S, 40, 23)];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const i = (y * S + x) * 4;
    const r = n1[0](x, y) * .4 + n1[1](x, y) * .3 + n1[2](x, y) * .17 + n1[3](x, y) * .09 + n1[4](x, y) * .04;
    const c = c1[0](x, y) * .55 + c1[1](x, y) * .3 + c1[2](x, y) * .15;
    const p = p1[0](x, y) * .6 + p1[1](x, y) * .3 + p1[2](x, y) * .1;
    d[i] = r * 255; d[i + 1] = c * 255; d[i + 2] = p * 255; d[i + 3] = Math.random() * 255;

    out.push(q(c, 1.6, 3.0, [0, 0, 0], 0.75)); out.push(q(c, 2.6, 3.6, car.spec.accent || [0.6, 0.4, 1], 0.35)); out.push(q(vmadd(c, f, 12), 5, 9, [1, 0.9, 0.75], 0.09));
    return out;
  }
  const g = groundAt(car.pos[0], car.pos[1] + 0.5, car.pos[2], 1 / 60);
  const gy = g ? car.pos[1] - (car.pos[1] + 0.5 - g.h) + 0.5 + 0.03 : car.pos[1];
  const hgt = g ? Math.max(0, car.pos[1] - g.h) : 50;
  const gn = g ? g.n : [0, 1, 0], f0 = [Math.sin(car.heading), 0, Math.cos(car.heading)], f = vnorm(vmadd(f0, gn, -vdot(f0, gn))), l = vcross(gn, f);
  const quad = (cx, cz, hw, hl, y, col, a) => { const c = [cx, y, cz]; return [vadd(vadd(c, vscale(l, -hw)), vscale(f, -hl)), vadd(vadd(c, vscale(l, hw)), vscale(f, -hl)), vadd(vadd(c, vscale(l, hw)), vscale(f, hl)), vadd(vadd(c, vscale(l, -hw)), vscale(f, hl)), col, a]; };
  const fade = clamp(1 - hgt / 25, 0, 1);
  const y = (g ? g.h : car.pos[1]) + 0.04 + (car.pos[1] - wrapW(car.pos[1]) * 0);
  out.push(quad(car.pos[0], car.pos[2], 1.6 + hgt * 0.05, 3.0 + hgt * 0.05, y, [0, 0, 0], 0.75 * fade));
  const ac = car.spec.accent || [0.6, 0.4, 1];
  out.push(quad(car.pos[0], car.pos[2], 2.6, 3.6, y, ac, 0.35 * fade));
  // headlight pool
  const hp = vadd(car.pos, vscale(f, 12));
  if (car.grounded) out.push(quad(hp[0], hp[2], 5, 9, y + 0.02 + f[1] * 12, [1, 0.9, 0.75], 0.09));
  return out;
}

    SAVE.contracts.push({ k: c.k, n: c.n[tier], r: c.r[tier], tier });

  update(dt, car, R) {
